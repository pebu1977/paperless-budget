services:
  paperless-budget:
    build: .
    container_name: paperless-budget
    restart: unless-stopped
    ports:
      - "8088:8000"
    env_file: .env
    volumes:
      - ./data:/data
    # Läuft Paperless im selben Docker-Host: dem Paperless-Netzwerk beitreten
    # und PAPERLESS_URL auf den Container-Namen setzen (z.B. http://paperless-webserver:8000).
    # networks:
    #   - paperless

# networks:
#   paperless:
#     external: true
#     name: paperless_default
